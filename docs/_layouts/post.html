---
layout: default
---
<div class="post-page">
  <a href="/blog/" class="back-link">← 返回博客</a>
  <div class="post-page-header">
    <h1>{{ page.title | split: " · " | first }}</h1>
    <div class="post-author">
      <img src="/images/photo-3.jpg" alt="蔡磊" class="post-author-avatar" />
      <div class="post-author-info">
        <span class="post-author-name">蔡磊</span>
        <span class="post-author-title">在日IT技术者 · 零代码开发</span>
      </div>
    </div>
    <div class="post-page-meta">
      <span>{{ page.date }}</span>
      {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
    </div>
  </div>
  {{ content }}
</div>
<script src="/js/float-photos.js" data-base="/images/"></script>
<script src="/js/toc.js"></script>
<script src="/js/related.js"></script>
<script src="/js/post-views.js"></script>
