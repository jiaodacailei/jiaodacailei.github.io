  <style>
    .tool-page {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 80px;

    .tool-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .tool-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .tool-header p {
      color: #64748b;
      font-size: 15px;
    }
    .tool-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .tool-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 18px;

      align-items: center;

      height: 26px;

      color: #fff;
      border-radius: 50%;

      font-weight: 700;
      flex-shrink: 0;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .level-btn {
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      transition: all .15s;
      font-family: inherit;
    }
    .level-btn:hover {
      border-color: #a5b4fc;
      background: #eef2ff;
    }
    .level-btn.selected {
      border-color: #6366f1;
      background: #eef2ff;
      color: #4f46e5;
    }
    .level-btn .lv-num {
      font-size: 20px;
      font-weight: 800;
      display: block;
      line-height: 1;
    }
    .level-btn .lv-label {
      font-size: 11px;
      color: #64748b;
      display: block;
      margin-top: 3px;
    }
    .level-btn.selected .lv-label { color: #6366f1; }

    .exp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .exp-btn {
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all .15s;
    }
    .exp-btn:hover { border-color: #a5b4fc; background: #eef2ff; }
    .exp-btn.selected { border-color: #6366f1; background: #eef2ff; }
    .exp-btn .exp-title { font-size: 14px; font-weight: 700; color: #334155; }
    .exp-btn.selected .exp-title { color: #4f46e5; }
    .exp-btn .exp-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    .result-card {
      display: none;
      background: linear-gradient(135deg, #eef2ff 0%, #f0fdf4 100%);
      border: 1.5px solid #c7d2fe;
      border-radius: 16px;
      padding: 28px;
      margin-top: 8px;
    }
    .result-card.show { display: block; }
    .result-salary {
      text-align: center;
      margin-bottom: 24px;
    }
    .result-salary .salary-label {
      font-size: 13px;
      color: #6366f1;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .result-salary .salary-range {
      font-size: 36px;
      font-weight: 900;
      color: #312e81;
      margin: 6px 0 2px;
      line-height: 1;
    }
    .result-salary .salary-unit {
      font-size: 13px;
      color: #6366f1;
    }
    .result-salary .salary-annual {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .result-divider {
      border: none;
      border-top: 1px solid #c7d2fe;
      margin: 18px 0;
    }
    .result-section-title {
      font-size: 12px;
      font-weight: 700;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .result-jobs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 4px;
    }
    .job-tag {
      background: #fff;
      border: 1px solid #c7d2fe;
      color: #4f46e5;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .job-tag.blocked {
      background: #f1f5f9;
      border-color: #e2e8f0;
      color: #94a3b8;
      text-decoration: line-through;
    }
    .result-advice {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      color: #334155;
      line-height: 1.7;
      border-left: 3px solid #6366f1;
    }
    .benchmark-bar {
      margin: 14px 0 4px;
    }
    .benchmark-bar .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    .bar-track {
      height: 10px;
      background: #e2e8f0;
      border-radius: 99px;
      position: relative;
      overflow: visible;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #818cf8, #6366f1);
      transition: width .5s ease;
    }
    .bar-marker {
      position: absolute;
      top: -3px;
      width: 16px;
      height: 16px;
      background: #6366f1;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(99,102,241,.4);
      transform: translateX(-50%);
      transition: left .5s ease;
    }
    .source-note {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 28px;
    }
    .source-note a { color: #6366f1; text-decoration: none; }
    @media (max-width: 480px) {
      .level-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .level-btn .lv-num { font-size: 16px; }
      .result-salary .salary-range { font-size: 28px; }

  <div class="tool-page">
    <div class="tool-header">
      <div class="section-eyebrow">Tool</div>
      <h1>日本IT薪资测算</h1>
      <p>根据你的 <strong>日语等级</strong> × <strong>IT经验</strong>，估算在日本派遣市场的月薪区间和可参与工作范围</p>
    </div>

    <!-- Step 1: 日语等级 -->
    <div class="tool-card">
      <h2><span class="step">1</span>你的IT日语等级</h2>
      <div class="level-grid" id="levelGrid">
        <button class="level-btn" data-level="10"><span class="lv-num">10</span><span class="lv-label">初学者</span></button>
        <button class="level-btn" data-level="9"><span class="lv-num">9</span><span class="lv-label">不擅长</span></button>
        <button class="level-btn" data-level="8"><span class="lv-num">8</span><span class="lv-label">微妙</span></button>
        <button class="level-btn" data-level="7"><span class="lv-num">7</span><span class="lv-label">普通</span></button>
        <button class="level-btn" data-level="6"><span class="lv-num">6</span><span class="lv-label">一般流畅</span></button>
        <button class="level-btn" data-level="5"><span class="lv-num">5</span><span class="lv-label">几乎流畅</span></button>
        <button class="level-btn" data-level="4"><span class="lv-num">4</span><span class="lv-label">流畅</span></button>
        <button class="level-btn" data-level="3"><span class="lv-num">3</span><span class="lv-label">相当流畅</span></button>
        <button class="level-btn" data-level="2"><span class="lv-num">2</span><span class="lv-label">业务水平</span></button>
        <button class="level-btn" data-level="1"><span class="lv-num">1</span><span class="lv-label">母语水平</span></button>
      </div>
      <p style="font-size:12px;color:#94a3b8;margin-top:8px;">不确定自己几级？参考 <a href="../blog/posts/it-japanese-level.html" style="color:#6366f1;text-decoration:none;">→ IT日语评级指南</a></p>
    </div>

    <!-- Step 2: IT经验 -->
    <div class="tool-card">
      <h2><span class="step">2</span>你的IT工作经验</h2>
      <div class="exp-grid" id="expGrid">
        <button class="exp-btn" data-exp="0"><span class="exp-title">1年以内</span><span class="exp-sub">刚入行 · 学习阶段</span></button>
        <button class="exp-btn" data-exp="1"><span class="exp-title">1～3年</span><span class="exp-sub">初级工程师</span></button>
        <button class="exp-btn" data-exp="2"><span class="exp-title">3～5年</span><span class="exp-sub">中级工程师</span></button>
        <button class="exp-btn" data-exp="3"><span class="exp-title">5～10年</span><span class="exp-sub">资深工程师</span></button>
        <button class="exp-btn" data-exp="4"><span class="exp-title">10年以上</span><span class="exp-sub">高级 · 架构师</span></button>
        <button class="exp-btn" data-exp="5"><span class="exp-title">PM / 管理岗</span><span class="exp-sub">有团队管理经验</span></button>
      </div>
    </div>

    <!-- Result -->
    <div class="result-card" id="resultCard">
      <div class="result-salary">
        <div class="salary-label">派遣市场参考月薪（手取）</div>
        <div class="salary-range" id="salaryRange">－</div>
        <div class="salary-unit">万円 / 月</div>
        <div class="salary-annual" id="salaryAnnual"></div>
      </div>

      <hr class="result-divider" />

      <div class="result-section-title">与市场基准对比</div>
      <div class="benchmark-bar">
        <div class="bar-labels">
          <span>新手 25万</span>
          <span>平均 43万</span>
          <span>资深 60万</span>
          <span>PM 100万</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="barFill" style="width:0%"></div>
          <div class="bar-marker" id="barMarker" style="left:0%"></div>
        </div>
      </div>

      <hr class="result-divider" />

      <div class="result-section-title">当前可参与的工作</div>
      <div class="result-jobs" id="resultJobs"></div>

      <hr class="result-divider" />

      <div class="result-section-title">提升建议</div>
      <div class="result-advice" id="resultAdvice"></div>
    </div>

    <p class="source-note">
      数据来源：
      <a href="../blog/posts/it-japanese-level.html">IT日语评级体系</a> ·
      <a href="../blog/posts/salary-benchmark.html">日本IT薪资水平</a>
      · 仅供参考，实际薪资因技术栈、地区、会社不同而有差异
    </p>
  </div>

  <footer>
    <p>© 2026 蔡磊 · 用心记录，持续成长</p>

      '4-2': { min: 60, max: 78, jobs: JOBS_ALL.slice(0, 7), advice: '日语2级+中级经验，已经是精英段位。可以独立承接项目，直接跟客户谈规格，薪资谈判筹码很强。' },
      '4-3': { min: 72, max: 92, jobs: JOBS_ALL, advice: '全生命周期都可以做，且日语无障碍。建议转型为技术合伙人或自由顾问，突破派遣模式的薪资天花板。' },
      '4-4': { min: 78, max: 100, jobs: JOBS_ALL, advice: '顶端配置。在日本市场，这个组合可以直接进入客户方正社员或CTO级别的岗位，不应该停在派遣层级了。' },
      '4-5': { min: 85, max: 120, jobs: JOBS_ALL, advice: '日语×经验×管理的终极组合。年收1000万以上是完全合理的目标。考虑创业、合伙人或客户方高管，派遣已经不是最优选择了。' },
    };

    function getLevelGroup(level) {
      if (level >= 9) return 0;
      if (level >= 7) return 1;
      if (level >= 5) return 2;
      if (level >= 3) return 3;
      return 4;
    }

    function compute() {
      if (selectedLevel === null || selectedExp === null) return;
      var lg = getLevelGroup(selectedLevel);
      var key = lg + '-' + selectedExp;
      var data = MATRIX[key];
      if (!data) return;

      var mid = (data.min + data.max) / 2;
      var pct = Math.min(100, Math.max(0, (mid - 22) / (100 - 22) * 100));

      document.getElementById('salaryRange').textContent = data.min + '～' + data.max;
      document.getElementById('salaryAnnual').textContent =
        '折合年収約 ' + Math.round(data.min * 12 / 10) * 10 + '～' + Math.round(data.max * 12 / 10) * 10 + ' 万日元';

      document.getElementById('barFill').style.width = pct + '%';
      document.getElementById('barMarker').style.left = pct + '%';

      var jobsEl = document.getElementById('resultJobs');
      jobsEl.innerHTML = JOBS_ALL.map(function (j) {
        var ok = data.jobs.indexOf(j) !== -1;
        return '<span class="job-tag' + (ok ? '' : ' blocked') + '">' + j + '</span>';
      }).join('');

      document.getElementById('resultAdvice').textContent = data.advice;

      var card = document.getElementById('resultCard');
      card.classList.add('show');
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('levelGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.level-btn');
      if (!btn) return;
      document.querySelectorAll('.level-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedLevel = parseInt(btn.dataset.level);
      compute();
    });

    document.getElementById('expGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.exp-btn');
      if (!btn) return;
      document.querySelectorAll('.exp-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedExp = parseInt(btn.dataset.exp);
      compute();
    });
  })();
  </script>
