<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>N2真题模考：2020年12月 言語知識・読解</title>
<link rel="stylesheet" href="/css/listening-page.css">
<link rel="stylesheet" href="/css/exam-page.css">
</head>
<body>

<div id="gate" data-hash="bb6db7538afe36c647632bf9a561cf15101756f132337f1d650ac8cd95cc3c81">
  <div class="box">
    <h2>&#128274; パスワードを入力してください</h2>
    <input type="password" id="pwdInput" placeholder="パスワード" autofocus />
    <button id="pwdBtn">開く</button>
    <div class="err" id="pwdErr"></div>
  </div>
</div>

<div id="content" style="display:none">
  <div class="sticky-header">
    <div class="sh-title" id="examTitle">N2真题模考</div>
    <div class="tab-bar" id="examTabBar"></div>
  </div>

  <div style="padding: 0 1em; margin: 0.8em 0; font-size: 0.9em;">
    <a href="/private/n2-listening/2020-12/">→ 同一套真题的聴解精听页</a>
  </div>

  <button class="settings-toggle" id="settingsToggle" title="再生設定"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14,-0.23,0.41,-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
  <div class="settings-panel" id="settingsPanel"></div>

  <!-- 迷你播放器——跟教材课页面同一份静态标记，listening-page.js顶层直接
       document.getElementById 这些mp*元素、无判空地addEventListener，
       没有这些元素会在脚本顶层抛未捕获异常，把同一个<script>里排在后面
       的Tab切换/默写/填空/单词测试这些代码全部连带不执行（同一个<script>
       标签内一个顶层语句未捕获抛错，会中断这个脚本剩余的全部顶层语句，
       亲测验证过，不是"各个IIFE互相独立"）。平时不会用到播放列表/上一句
       下一句这类多句导航（生词/生词测试都是单卡片/单题交互，不是连续
       播放一串句子），但保留完整结构最安全，真被触发时功能也正常。 -->
  <div class="mini-player" id="miniPlayer">
    <button class="mp-btn mp-first" id="mpFirst" title="最初" disabled><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="mp-btn mp-prev" id="mpPrev" title="前へ" disabled><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
    <button class="mp-btn mp-playpause" id="mpPlayPause" title="再生/一時停止"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button class="mp-btn mp-next" id="mpNext" title="次へ" disabled><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
    <button class="mp-btn mp-last" id="mpLast" title="最後" disabled><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <div class="mp-info">
      <div class="mp-scope" id="mpScope">-</div>
      <div class="mp-pos" id="mpPos"></div>
    </div>
    <button class="mp-btn mp-loop" id="mpLoop" title="ループ"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    <button class="mp-btn mp-stop" id="mpStop" title="停止"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>

  <div class="exam-score-banner" id="examScoreBanner"></div>

  <div id="examRoot" style="padding: 0 1em;"></div>

  <div class="exam-submit-bar">
    <span class="exam-progress-text" id="examProgressText"></span>
    <button class="exam-submit-btn" id="examSubmitBtn">交卷</button>
  </div>
</div>

<script src="data.js"></script>
<script src="/js/private-gate.js"></script>
<script src="/js/page-renderer.js"></script>
<script src="/js/exam-page.js"></script>
<script src="/js/listening-page.js"></script>
</body>
</html>
